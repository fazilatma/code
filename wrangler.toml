# Keep this name stable: the draft Queue bindings below are provisioned as
# scraper4-cloudflare-jobs and scraper4-cloudflare-jobs-dlq.
name = "scraper4-cloudflare"
main = "worker-src/main.ts"
compatibility_date = "2026-08-19"
workers_dev = true

# Draft bindings are provisioned and re-attached automatically by Wrangler.
# No account resource IDs belong in source control.
[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"

# JOBS_DLQ is intentionally also a producer binding. This makes Wrangler
# provision the DLQ before it installs the JOBS consumer configuration.
[[queues.producers]]
binding = "JOBS"

[[queues.producers]]
binding = "JOBS_DLQ"

[[queues.consumers]]
queue = "scraper4-cloudflare-jobs"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "scraper4-cloudflare-jobs-dlq"
max_concurrency = 2

[[r2_buckets]]
binding = "BACKUPS"

[triggers]
crons = ["*/5 * * * *"]

[vars]
WORKER_VERSION = "1.0.0"
REQUEST_TIMEOUT_MS = "25000"
MAX_RESPONSE_BYTES = "8000000"
DETAIL_CONCURRENCY = "4"
JOB_CHUNK_SIZE = "20"

[observability.logs]
enabled = true
invocation_logs = true
